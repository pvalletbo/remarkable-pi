name: test
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run verify
      - run: bun run demo -- --once
      # Node is only for verifying compatibility with the normal pi host.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun run test:pi-node
